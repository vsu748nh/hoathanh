      const getGoogleDriveFileId = (url) => {
        if (!url || typeof url !== 'string') return null;
        const trimmed = url.trim();
        const driveRegex = /(?:drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:[^&]+&)*id=)|lh3\.googleusercontent\.com\/d\/)([a-zA-Z0-9_-]+)/i;
        const match = trimmed.match(driveRegex);
        return match && match[1] ? match[1] : null;
      };

      const isGoogleDriveUrl = (url) => getGoogleDriveFileId(url) !== null;

      const isDropboxUrl = (url) => {
        if (!url || typeof url !== 'string') return false;
        return /dropbox\.com/i.test(url) || /dl\.dropboxusercontent\.com/i.test(url);
      };

      const getGoogleDrivePreviewIframeUrl = (url) => {
        const fileId = getGoogleDriveFileId(url);
        if (!fileId) return null;
        return `https://drive.google.com/file/d/${fileId}/preview`;
      };

      const getGoogleDriveViewUrl = (url) => {
        const fileId = getGoogleDriveFileId(url);
        if (!fileId) return url;
        return `https://drive.google.com/file/d/${fileId}/view?usp=sharing`;
      };

      const getDriveDirectLink = (url, mediaType = 'auto') => {
        if (!url || typeof url !== 'string') return url || '';
        const trimmed = url.trim();

        // 1. Google Drive conversion
        const fileId = getGoogleDriveFileId(trimmed);
        if (fileId) {
          if (mediaType === 'audio') {
            return `https://drive.google.com/uc?export=download&id=${fileId}`;
          }
          // Convert all images, videos, url & photoUrl from Drive to standard lh3 streamable link format
          return `https://lh3.googleusercontent.com/d/${fileId}`;
        }

        // 2. Dropbox conversion
        if (isDropboxUrl(trimmed)) {
          let direct = trimmed.replace(/www\.dropbox\.com/i, 'dl.dropboxusercontent.com');
          if (direct.includes('dl=0')) {
            direct = direct.replace('dl=0', 'raw=1');
          } else if (!direct.includes('raw=1') && !direct.includes('dl=1')) {
            direct += (direct.includes('?') ? '&' : '?') + 'raw=1';
          }
          return direct;
        }

        return trimmed;
      };

            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            <div className="grid grid-cols-4 gap-2 sm:gap-4 my-6">
              <div className="bg-gradient-to-b from-rose-50 to-orange-50 rounded-2xl p-3 sm:p-4 border border-rose-100 shadow-sm">
                <span className="block text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-600 font-playfair">{time.days}</span>
                <span className="text-xs sm:text-sm text-slate-600 font-medium mt-1 block">Ngày</span>
              </div>
              <div className="bg-gradient-to-b from-rose-50 to-orange-50 rounded-2xl p-3 sm:p-4 border border-rose-100 shadow-sm">
                <span className="block text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-600 font-playfair">{String(time.hours).padStart(2, '0')}</span>
                <span className="text-xs sm:text-sm text-slate-600 font-medium mt-1 block">Giờ</span>
              </div>
              <div className="bg-gradient-to-b from-rose-50 to-orange-50 rounded-2xl p-3 sm:p-4 border border-rose-100 shadow-sm">
                <span className="block text-2xl sm:text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-orange-500 to-rose-600 font-playfair">{String(time.minutes).padStart(2, '0')}</span>
                <span className="text-xs sm:text-sm text-slate-600 font-medium mt-1 block">Phút</span>
              </div>
              <div className="bg-gradient-to-b from-rose-50 to-orange-50 rounded-2xl p-3 sm:p-4 border border-rose-100 shadow-sm">
                <span className="block text-2xl sm:text-4xl font-extrabold text-rose-600 font-playfair">{String(time.seconds).padStart(2, '0')}</span>
                <span className="text-xs sm:text-sm text-slate-600 font-medium mt-1 block">Giây</span>
              </div>
            </div>

            <div className="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-rose-100/70 text-rose-700 text-xs sm:text-sm font-medium">
              <i className="fa-regular fa-calendar-check text-rose-500"></i>
              <span>Chính thức quen nhau từ: <strong>{startDateStr}</strong></span>
            </div>
          </div>
        );
      };

      // 4. Gallery Section (Responsive Grid with hover zoom + rounded corners)
      const GallerySection = ({ items, onUpdateItems }) => {
        const [filter, setFilter] = useState('all');
        const [lightboxItem, setLightboxItem] = useState(null);
        const [isMuted, setIsMuted] = useState(true);
        const [videoError, setVideoError] = useState(false);
        const videoRef = React.useRef(null);

        const handleToggleHighlight = (e, itemId) => {
          e.stopPropagation();
          if (!onUpdateItems) return;
          const updated = items.map((it) =>
            it.id === itemId
              ? { ...it, category: it.category === 'highlight' ? 'daily' : 'highlight' }
              : it
          );
          onUpdateItems(updated);
        };

        React.useEffect(() => {
          setVideoError(false);
          setIsMuted(true);

          if (lightboxItem?.type === 'video' && videoRef.current) {
            videoRef.current.muted = true;
            const playPromise = videoRef.current.play();
            if (playPromise !== undefined) {
              playPromise.catch((err) => {
                console.log('Video autoplay handled or blocked:', err);
              });
            }
          }
        }, [lightboxItem]);

        const filtered = items.filter((item) => {
          if (filter === 'all') return true;
          if (filter === 'image') return item.type === 'image';
          if (filter === 'video') return item.type === 'video';
          if (filter === 'highlight') return item.category === 'highlight';
          return true;
        });

        return (
          <section id="gallery-section" className="py-12 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto scroll-mt-6 relative">
            <div className="text-center mb-8">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-rose-100 text-rose-600 text-xs font-semibold uppercase tracking-wider mb-2">
                <i className="fa-solid fa-camera-retro"></i>
                <span>Bộ Sưu Tập Kỷ Niệm</span>
              </div>
              <h2 className="font-playfair text-3xl sm:text-5xl font-bold text-slate-800">
                Góc Kỷ Niệm 2 Tháng
              </h2>
              <p className="mt-2 text-slate-600 text-sm sm:text-base max-w-xl mx-auto">
                Từng bức ảnh và video clip nhỏ lưu giữ muôn vàn nụ cười và khoảnh khắc ngọt ngào của hai đứa.
              </p>

              {/* Filter Tabs */}
              <div className="flex flex-wrap items-center justify-center gap-2 mt-6">
                {['all', 'image', 'video', 'highlight'].map((cat) => (
                  <button
                    key={cat}
                    onClick={() => setFilter(cat)}
                    className={`px-4 py-2 rounded-full text-xs sm:text-sm font-medium transition-all cursor-pointer ${
                      filter === cat
                        ? 'bg-gradient-to-r from-orange-400 to-rose-500 text-white shadow-md'
                        : 'bg-white/70 text-slate-600 hover:bg-white hover:text-rose-500'
                    }`}
                  >
                    {cat === 'all' && `Tất cả (${items.length})`}
                    {cat === 'image' && `📸 Hình ảnh`}
                    {cat === 'video' && `🎬 Video Clips`}
                    {cat === 'highlight' && `💖 Đặc sắc`}
                  </button>
                ))}
              </div>
            </div>

            {/* Masonry / Flex Grid Layout */}
            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
              {filtered.map((item) => (
                <div
                  key={item.id}
                  onClick={() => setLightboxItem(item)}
                  className="group relative cursor-pointer overflow-hidden rounded-3xl bg-white/80 p-2 shadow-lg border border-rose-100 hover:shadow-2xl hover:border-rose-300 transition-all duration-300 transform hover:-translate-y-1.5"
                >
                  <div className="relative overflow-hidden rounded-2xl aspect-[4/3] bg-slate-100">
                    {item.type === 'image' ? (
                      /* Image Tag with Zoom-in & rounded corner effect on hover */
                      <img
                        src={convertGoogleDriveUrl(item.url, 'image')}
                        alt={item.title}
                        loading="lazy"
                        className="w-full h-full object-cover rounded-2xl transition-all duration-700 ease-out group-hover:scale-110 group-hover:rounded-3xl"
                      />
                    ) : (
                      /* Video Tag with preview */
                      <div className="relative w-full h-full overflow-hidden rounded-2xl">
                        <video
                          src={convertGoogleDriveUrl(item.url, 'video')}
                          poster={item.poster ? convertGoogleDriveUrl(item.poster, 'image') : undefined}
                          muted
                          loop
                          playsInline
                          className="w-full h-full object-cover rounded-2xl transition-all duration-700 ease-out group-hover:scale-110 group-hover:rounded-3xl"
                        />
                        <div className="absolute inset-0 bg-black/20 flex items-center justify-center">
                          <div className="w-12 h-12 rounded-full bg-white/90 text-rose-600 flex items-center justify-center shadow-lg group-hover:scale-110 transition-transform">
                            <i className="fa-solid fa-play ml-1"></i>
                          </div>
                        </div>
                      </div>
                    )}

                    {/* Tag badge */}
                    <div className="absolute top-3 left-3 bg-black/50 backdrop-blur-md text-white text-xs px-2.5 py-1 rounded-full flex items-center gap-1 font-medium z-10">
                      <i className={item.type === 'image' ? 'fa-regular fa-image' : 'fa-solid fa-film'}></i>
                      <span>{item.type === 'image' ? 'Ảnh' : 'Clip'}</span>
                    </div>

                    {/* Date Tag & Heart Toggle Button */}
                    <div className="absolute top-3 right-3 flex items-center gap-1.5 z-10">
                      {item.date && (
                        <div className="bg-black/40 backdrop-blur-md text-white text-[11px] px-2.5 py-1 rounded-full font-medium hidden sm:block">
                          {item.date}
                        </div>
                      )}
                      <button
                        type="button"
                        onClick={(e) => handleToggleHighlight(e, item.id)}
                        title={item.category === 'highlight' ? 'Đặc sắc (Bấm để bỏ)' : 'Bấm icon Trái tim để chuyển qua mục Đặc Sắc'}
                        className={`p-1.5 sm:p-2 rounded-full backdrop-blur-md transition-all shadow-md cursor-pointer ${
                          item.category === 'highlight'
                            ? 'bg-rose-500 text-white hover:bg-rose-600 scale-105 ring-2 ring-white/60'
                            : 'bg-black/40 text-white/90 hover:bg-black/70 hover:text-rose-400 hover:scale-110'
                        }`}
                      >
                        <i className={`fa-solid fa-heart ${item.category === 'highlight' ? 'text-white' : ''}`}></i>
                      </button>
                    </div>

                    {/* Hover Overlay */}
                    <div className="absolute inset-0 bg-gradient-to-t from-black/80 via-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300 p-4 flex flex-col justify-end text-white rounded-2xl">
                      <h3 className="font-semibold text-base sm:text-lg truncate">{item.title}</h3>
                      {item.caption && <p className="text-xs text-slate-200 mt-1 line-clamp-2">{item.caption}</p>}
                    </div>
                  </div>

                  <div className="p-3 flex items-center justify-between">
                    <div className="min-w-0 flex-1 pr-2">
                      <p className="font-semibold text-slate-800 text-sm sm:text-base truncate">{item.title}</p>
                      {item.caption && <p className="text-xs text-slate-500 truncate mt-0.5">{item.caption}</p>}
                    </div>
                    <button
                      type="button"
                      onClick={(e) => handleToggleHighlight(e, item.id)}
                      title={item.category === 'highlight' ? 'Bỏ khỏi mục Đặc sắc' : 'Chuyển qua mục Đặc sắc'}
                      className={`p-1.5 rounded-full transition-colors cursor-pointer flex-shrink-0 ${
                        item.category === 'highlight'
                          ? 'bg-rose-100 text-rose-600 hover:bg-rose-200'
                          : 'text-slate-300 hover:text-rose-500 hover:bg-rose-50'
                      }`}
                    >
                      <i className={`fa-solid fa-heart ${item.category === 'highlight' ? 'text-rose-500' : ''}`}></i>
                    </button>
                  </div>
                </div>
              ))}
            </div>

            {/* Lightbox Modal */}
            {lightboxItem && (
              <div
                onClick={() => setLightboxItem(null)}
                className="fixed inset-0 z-[9999] bg-black/85 backdrop-blur-md flex items-center justify-center p-4 overflow-y-auto animate-fade-in"
              >
                <div
                  onClick={(e) => e.stopPropagation()}
                  className="relative max-w-3xl w-full bg-slate-900 rounded-3xl overflow-hidden shadow-2xl text-white my-auto flex flex-col max-h-[90vh]"
                >
                  <button
                    onClick={() => setLightboxItem(null)}
                    className="absolute top-3 right-3 z-30 w-10 h-10 rounded-full bg-black/70 hover:bg-black text-white flex items-center justify-center transition-colors cursor-pointer border border-white/20"
                  >
                    <i className="fa-solid fa-xmark text-lg"></i>
                  </button>

                  <div className="relative bg-black flex-1 flex items-center justify-center min-h-[220px] max-h-[70vh] p-2 sm:p-4 overflow-hidden">
                    {lightboxItem.type === 'image' ? (
                      <img src={convertGoogleDriveUrl(lightboxItem.url, 'image')} alt={lightboxItem.title} className="max-h-[65vh] max-w-full w-auto h-auto object-contain rounded-xl mx-auto shadow-lg" />
                    ) : isGoogleDriveUrl(lightboxItem.url) ? (
                      <div className="relative w-full h-[55vh] sm:h-[65vh] flex flex-col items-center justify-center bg-black rounded-xl overflow-hidden">
                        <iframe
                          src={getGoogleDrivePreviewIframeUrl(lightboxItem.url)}
                          className="w-full h-full border-0 rounded-xl"
                          allow="autoplay; encrypted-media; picture-in-picture"
                          allowFullScreen
                          title={lightboxItem.title}
                        />
                        <div className="absolute bottom-3 right-3 z-20">
                          <a
                            href={getGoogleDriveViewUrl(lightboxItem.url)}
                            target="_blank"
                            rel="noopener noreferrer"
                            className="bg-black/80 hover:bg-rose-600 text-white text-xs font-medium px-3.5 py-1.5 rounded-full backdrop-blur-md border border-white/20 flex items-center gap-1.5 transition-all shadow-xl"
                          >
                            <i className="fa-solid fa-arrow-up-right-from-square text-xs"></i>
                            <span>Mở trên Google Drive ↗</span>
                          </a>
                        </div>
                      </div>
                    ) : videoError ? (
                      <div className="relative max-h-[65vh] max-w-full w-auto h-auto flex items-center justify-center group my-auto">
                        <img
                          src={convertGoogleDriveUrl(lightboxItem.poster || 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop', 'image')}
                          alt={lightboxItem.title}
                          onError={(e) => {
                            e.target.src = 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop';
                          }}
                          className="max-h-[65vh] max-w-full w-auto h-auto object-contain rounded-xl mx-auto shadow-lg"
                        />
                        <a
                          href={getGoogleDriveViewUrl(lightboxItem.url)}
                          target="_blank"
                          rel="noopener noreferrer"
                          className="absolute inset-0 flex flex-col items-center justify-center bg-black/40 hover:bg-black/60 transition-colors rounded-xl p-4 text-center group"
                        >
                          <div className="w-16 h-16 rounded-full bg-rose-500 hover:bg-rose-600 text-white flex items-center justify-center shadow-2xl group-hover:scale-110 transition-transform mb-2">
                            <i className="fa-solid fa-play text-2xl ml-1 text-white"></i>
                          </div>
                          <span className="text-white text-xs font-medium px-3.5 py-1.5 rounded-full bg-black/60 backdrop-blur-md border border-white/20">
                            Nhấn để mở xem video clip ↗
                          </span>
                        </a>
                      </div>
                    ) : (
                      <div className="relative w-full h-full flex items-center justify-center">
                        <video
                          ref={videoRef}
                          src={convertGoogleDriveUrl(lightboxItem.url, 'video')}
                          controls
                          autoPlay
                          playsInline
                          muted={isMuted}
                          preload="auto"
                          onError={() => setVideoError(true)}
                          className="max-h-[65vh] max-w-full w-auto h-auto object-contain rounded-xl mx-auto shadow-lg"
                        />
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            if (videoRef.current) {
                              const nextState = !isMuted;
                              videoRef.current.muted = nextState;
                              setIsMuted(nextState);
                              videoRef.current.play().catch(() => {});
                            }
                          }}
                          className="absolute bottom-4 right-4 z-20 px-3.5 py-1.5 rounded-full bg-black/80 hover:bg-black text-white text-xs font-medium flex items-center gap-2 backdrop-blur-md border border-white/20 shadow-lg cursor-pointer transition-transform active:scale-95"
                        >
                          <i className={isMuted ? "fa-solid fa-volume-xmark text-rose-300" : "fa-solid fa-volume-high text-emerald-400"}></i>
                          <span>{isMuted ? 'Bật tiếng (Unmute)' : 'Tắt tiếng'}</span>
                        </button>
                      </div>
                    )}
                  </div>

                  <div className="p-5 sm:p-6 bg-slate-900 border-t border-slate-800 w-full flex-shrink-0 flex items-start justify-between gap-4">
                    <div className="min-w-0 flex-1">
                      <h3 className="text-xl font-bold font-playfair text-rose-300">{lightboxItem.title}</h3>
                      {lightboxItem.caption && <p className="mt-2 text-slate-200 text-sm sm:text-base leading-relaxed">{lightboxItem.caption}</p>}
                    </div>
                    <button
                      type="button"
                      onClick={(e) => {
                        handleToggleHighlight(e, lightboxItem.id);
                        setLightboxItem({
                          ...lightboxItem,
                          category: lightboxItem.category === 'highlight' ? 'daily' : 'highlight'
                        });
                      }}
                      title={lightboxItem.category === 'highlight' ? 'Đã ở mục Đặc Sắc (Bấm để bỏ)' : 'Chuyển vào mục Đặc Sắc'}
                      className={`px-3.5 py-2 rounded-full border text-xs sm:text-sm font-semibold flex items-center gap-2 transition-all cursor-pointer flex-shrink-0 ${
                        lightboxItem.category === 'highlight'
                          ? 'bg-rose-500 text-white border-rose-500 shadow-lg'
                          : 'bg-slate-800 text-slate-300 border-slate-700 hover:text-white hover:border-rose-400'
                      }`}
                    >
                      <i className="fa-solid fa-heart"></i>
                      <span>{lightboxItem.category === 'highlight' ? 'Mục Đặc Sắc' : 'Thêm vào Đặc Sắc'}</span>
                    </button>
                  </div>
                </div>
              </div>
            )}
          </section>
        );
      };

      // 5. Timeline Section
      const TimelineSection = ({ milestones }) => {
        return (
          <section className="py-12 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto relative">
            <div className="text-center mb-10">
              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-orange-100 text-orange-600 text-xs font-semibold uppercase tracking-wider mb-2">
                <i className="fa-solid fa-timeline"></i>
                <span>Cột Mốc Tình Yêu</span>
              </div>
              <h2 className="font-playfair text-3xl sm:text-4xl font-bold text-slate-800">
                Hành Trình 60 Ngày Cùng Nhau
              </h2>
            </div>

            <div className="relative border-l-2 border-rose-300/80 ml-4 sm:ml-28 space-y-8">
              {milestones.map((m) => (
                <div key={m.id} className="relative pl-6 sm:pl-8 group">
                  <div className="absolute -left-[17px] top-1.5 w-8 h-8 rounded-full bg-white border-2 border-rose-400 flex items-center justify-center shadow-md">
                    <i className={`fa-solid ${m.icon} text-xs text-rose-500`}></i>
                  </div>
                  <div className="sm:absolute sm:-left-32 sm:top-1.5 sm:w-24 sm:text-right text-xs font-bold text-rose-600 uppercase tracking-wider mb-1 sm:mb-0">
                    {m.date}
                  </div>
                  <div className="bg-white/80 backdrop-blur-md rounded-2xl p-5 shadow-md border border-rose-100 hover:shadow-xl transition-all">
                    <div className="flex flex-col md:flex-row gap-4 items-start md:items-center">
                      <div className="flex-1">
                        <h3 className="font-playfair text-xl font-bold text-slate-800">{m.title}</h3>
                        <p className="text-slate-600 text-sm mt-2 leading-relaxed">{m.description}</p>
                      </div>
                      {m.photoUrl && (
                        <div className="w-full md:w-32 h-24 rounded-xl overflow-hidden flex-shrink-0">
                          <img src={convertGoogleDriveUrl(m.photoUrl, 'image')} alt={m.title} className="w-full h-full object-cover group-hover:scale-105 transition-transform" />
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>
        );
      };

      // 6. Love Notes & Letter Section
      const LoveNotesSection = ({ letterContent, notes, onUpdateNotes, person1Name, person2Name }) => {
        const [newNote, setNewNote] = useState('');
        const [authorName, setAuthorName] = useState(person1Name);

        const handleAddNote = (e) => {
          e.preventDefault();
          if (!newNote.trim()) return;
          const colors = [
            'from-rose-100 to-pink-100 border-rose-200',
            'from-amber-100 to-orange-100 border-amber-200',
            'from-orange-100 to-rose-100 border-orange-200'
          ];
          const next = [
            {
              id: Date.now().toString(),
              author: authorName || 'Dấu yêu',
              content: newNote.trim(),
              tag: 'Kỷ niệm mới',
              colorBg: colors[Math.floor(Math.random() * colors.length)]
            },
            ...notes
          ];
          if (onUpdateNotes) onUpdateNotes(next);
          setNewNote('');
        };

        const handleDeleteNote = (id) => {
          const next = notes.filter(n => n.id !== id);
          if (onUpdateNotes) onUpdateNotes(next);
        };

        return (
          <section className="py-12 px-4 sm:px-6 lg:px-8 max-w-4xl mx-auto relative">
            <div className="bg-gradient-to-br from-white/90 via-rose-50/80 to-orange-50/90 backdrop-blur-md rounded-3xl p-6 sm:p-10 shadow-xl border border-rose-200 mb-12">
              <div className="flex items-center gap-2 text-rose-500 font-semibold text-xs sm:text-sm uppercase tracking-wider mb-4">
                <i className="fa-solid fa-envelope-open-text"></i>
                <span>Bức Thư Tình Tròn 2 Tháng</span>
              </div>
              <h2 className="font-dancing text-3xl sm:text-4xl font-bold text-slate-800 mb-6">
                Gửi em, mảnh ghép ngọt ngào của anh 💕
              </h2>
              <div className="text-slate-700 text-base sm:text-lg leading-relaxed whitespace-pre-line font-playfair italic bg-white/60 p-6 rounded-2xl border border-rose-100 shadow-inner">
                {letterContent}
              </div>
              <div className="mt-6 flex items-center justify-between">
                <span className="text-xs sm:text-sm text-slate-500">Tròn 60 ngày yêu thương</span>
                <div className="font-dancing text-2xl font-bold text-rose-600">Yêu em mãi mãi</div>
              </div>
            </div>

            <div className="text-center mb-6">
              <h3 className="font-playfair text-2xl font-bold text-slate-800">Lời Nhắn Nhủ Ngọt Ngào</h3>
            </div>

            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
              {notes.map((n) => (
                <div key={n.id} className={`bg-gradient-to-br ${n.colorBg} backdrop-blur-sm rounded-2xl p-5 shadow-md border flex flex-col justify-between group relative`}>
                  <div>
                    <div className="flex items-center justify-between mb-2">
                      <span className="text-[10px] font-bold uppercase tracking-wider px-2 py-0.5 rounded-full bg-white/80 text-rose-600">{n.tag || 'Lời nhắn'}</span>
                      {onUpdateNotes && (
                        <button
                          onClick={() => handleDeleteNote(n.id)}
                          title="Xóa lời nhắn này"
                          className="opacity-0 group-hover:opacity-100 p-1 text-slate-400 hover:text-rose-600 transition-opacity rounded-md hover:bg-white/60 cursor-pointer"
                        >
                          <i className="fa-solid fa-trash text-xs"></i>
                        </button>
                      )}
                    </div>
                    <p className="text-slate-800 text-sm italic">"{n.content}"</p>
                  </div>
                  <div className="mt-4 pt-3 border-t border-rose-200/50 flex items-center justify-between text-xs text-rose-700 font-medium">
                    <span>Từ: <strong>{n.author}</strong></span>
                    <i className="fa-solid fa-heart text-rose-500"></i>
                  </div>
                </div>
              ))}
            </div>

            <div className="bg-white/80 backdrop-blur-md rounded-2xl p-4 border border-rose-100 shadow-sm max-w-xl mx-auto">
              <form onSubmit={handleAddNote} className="space-y-3">
                <div className="flex gap-2">
                  <input
                    type="text"
                    placeholder="Tên người gửi"
                    value={authorName}
                    onChange={(e) => setAuthorName(e.target.value)}
                    className="w-1/3 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm focus:outline-none"
                  />
                  <input
                    type="text"
                    placeholder="Lời nhắn ngọt ngào dành cho đối phương..."
                    value={newNote}
                    onChange={(e) => setNewNote(e.target.value)}
                    className="flex-1 px-3 py-2 rounded-xl bg-slate-50 border border-slate-200 text-xs sm:text-sm focus:outline-none"
                  />
                </div>
                <button
                  type="submit"
                  className="w-full py-2.5 rounded-xl bg-gradient-to-r from-orange-400 to-rose-500 text-white font-medium text-xs sm:text-sm flex items-center justify-center gap-2 cursor-pointer"
                >
                  <i className="fa-solid fa-paper-plane"></i>
                  <span>Gửi Lời Nhắn Này</span>
                </button>
              </form>
            </div>
          </section>
        );
      };

      // 7. Persistent Audio Player Widget
      const AudioPlayerWidget = ({ audioUrl, audioTitle, isPlaying, onTogglePlay }) => {
        const audioRef = useRef(null);
        const formattedAudioUrl = convertGoogleDriveUrl(audioUrl, 'audio');

        useEffect(() => {
          if (audioRef.current) {
            if (isPlaying) {
              audioRef.current.play().catch(e => console.log('Audio play error:', e));
            } else {
              audioRef.current.pause();
            }
          }
        }, [isPlaying, formattedAudioUrl]);

        return (
          <>
            <audio ref={audioRef} src={formattedAudioUrl} loop preload="auto" />
            <div className="fixed bottom-4 left-4 right-4 sm:left-auto sm:right-6 sm:bottom-6 z-40 max-w-sm">
              <div className="bg-white/90 backdrop-blur-xl border border-rose-200 shadow-2xl rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 text-slate-800">
                <div className="flex items-center gap-3 overflow-hidden">
                  <div className={`w-10 h-10 rounded-full bg-gradient-to-tr from-amber-400 via-rose-500 to-pink-500 p-0.5 flex items-center justify-center ${isPlaying ? 'animate-spin' : ''}`} style={{ animationDuration: '6s' }}>
                    <div className="w-8 h-8 bg-slate-900 rounded-full flex items-center justify-center">
                      <i className="fa-solid fa-compact-disc text-rose-300 text-sm"></i>
                    </div>
                  </div>
                  <div className="min-w-0">
                    <span className="text-xs text-rose-500 font-semibold uppercase tracking-wider block">Nhạc nền lãng mạn</span>
                    <p className="text-xs sm:text-sm font-medium text-slate-700 truncate">{audioTitle}</p>
                  </div>
                </div>

                <button
                  onClick={onTogglePlay}
                  className="w-10 h-10 rounded-full bg-gradient-to-r from-orange-400 to-rose-500 text-white flex items-center justify-center shadow-lg hover:scale-105 active:scale-95 transition-transform flex-shrink-0 cursor-pointer"
                >
                  <i className={`fa-solid ${isPlaying ? 'fa-pause' : 'fa-play ml-0.5'}`}></i>
                </button>
              </div>
            </div>
          </>
        );
      };

      // 8. Customizer Modal
      const CustomizerModal = ({ isOpen, onClose, config, onSaveConfig, galleryItems, onSaveGallery, milestones, onSaveMilestones, loveNotes, onSaveLoveNotes }) => {
        const [person1, setPerson1] = useState(config.person1Name);
        const [person2, setPerson2] = useState(config.person2Name);
        const [startDate, setStartDate] = useState(config.startDate);
        const [audioUrl, setAudioUrl] = useState(config.audioUrl);
        const [audioTitle, setAudioTitle] = useState(config.audioTitle);
        const [letter, setLetter] = useState(config.letterContent);

        const [items, setItems] = useState(galleryItems);
        const [msList, setMsList] = useState(milestones);
        const [noteList, setNoteList] = useState(loveNotes);

        const [activeTab, setActiveTab] = useState('info');

        // Gallery state
        const [editingItemId, setEditingItemId] = useState(null);
        const [newItemUrl, setNewItemUrl] = useState('');
        const [newItemPoster, setNewItemPoster] = useState('');
        const [newItemTitle, setNewItemTitle] = useState('');
        const [newItemCaption, setNewItemCaption] = useState('');
        const [newItemDate, setNewItemDate] = useState('');
        const [newItemType, setNewItemType] = useState('image');
        const [newItemCategory, setNewItemCategory] = useState('daily');

        const resetGalleryForm = () => {
          setEditingItemId(null);
          setNewItemUrl('');
          setNewItemPoster('');
          setNewItemTitle('');
          setNewItemCaption('');
          setNewItemDate('');
          setNewItemType('image');
          setNewItemCategory('daily');
        };

        const handleStartEditItem = (it) => {
          setEditingItemId(it.id);
          setNewItemTitle(it.title || '');
          setNewItemType(it.type || 'image');
          setNewItemUrl(it.url || '');
          setNewItemPoster(it.poster || '');
          setNewItemDate(it.date || '');
          setNewItemCaption(it.caption || '');
          setNewItemCategory(it.category || 'daily');
        };

        // Milestone form state
        const [editingMsId, setEditingMsId] = useState(null);
        const [msDate, setMsDate] = useState('');
        const [msTitle, setMsTitle] = useState('');
        const [msDesc, setMsDesc] = useState('');
        const [msPhoto, setMsPhoto] = useState('');

        // Note form state
        const [editingNoteId, setEditingNoteId] = useState(null);
        const [noteAuthor, setNoteAuthor] = useState('');
        const [noteContent, setNoteContent] = useState('');
        const [noteTag, setNoteTag] = useState('');

        const [copySuccess, setCopySuccess] = useState(false);

        if (!isOpen) return null;

        const handleSave = () => {
          const formattedAudio = convertGoogleDriveUrl(audioUrl, 'audio');
          const formattedItems = items.map((it) => ({
            ...it,
            url: convertGoogleDriveUrl(it.url, it.type),
            poster: it.poster ? convertGoogleDriveUrl(it.poster, 'image') : undefined,
          }));
          const formattedMilestones = msList.map((m) => ({
            ...m,
            photoUrl: m.photoUrl ? convertGoogleDriveUrl(m.photoUrl, 'image') : undefined,
          }));

          onSaveConfig({ ...config, person1Name: person1, person2Name: person2, startDate, audioUrl: formattedAudio, audioTitle, letterContent: letter });
          onSaveGallery(formattedItems);
          onSaveMilestones(formattedMilestones);
          onSaveLoveNotes(noteList);
          onClose();
        };

        const handleSaveItem = () => {
          if (!newItemUrl.trim() || !newItemTitle.trim()) return;
          const finalUrl = convertGoogleDriveUrl(newItemUrl.trim(), newItemType);
          const finalPoster = newItemType === 'video'
            ? convertGoogleDriveUrl(newItemPoster.trim() || 'https://images.unsplash.com/photo-1518199266791-5375a83190b7?q=80&w=1200&auto=format&fit=crop', 'image')
            : undefined;

          if (editingItemId) {
            setItems(items.map((it) =>
              it.id === editingItemId
                ? {
                    ...it,
                    type: newItemType,
                    url: finalUrl,
                    poster: finalPoster,
                    title: newItemTitle.trim(),
                    caption: newItemCaption.trim() || 'Khoảnh khắc kỷ niệm ngọt ngào',
                    date: newItemDate.trim() || 'Kỷ niệm mới',
                    category: newItemCategory
                  }
                : it
            ));
          } else {
            setItems([...items, {
              id: Date.now().toString(),
              type: newItemType,
              url: finalUrl,
              poster: finalPoster,
              title: newItemTitle.trim(),
              caption: newItemCaption.trim() || 'Khoảnh khắc kỷ niệm ngọt ngào',
              date: newItemDate.trim() || 'Kỷ niệm mới',
              category: newItemCategory
            }]);
          }
          resetGalleryForm();
        };

        const handleSaveMilestone = () => {
          if (!msTitle.trim() || !msDate.trim()) return;
          const finalPhoto = msPhoto.trim() ? convertGoogleDriveUrl(msPhoto.trim(), 'image') : undefined;

          if (editingMsId) {
            setMsList(msList.map(m => m.id === editingMsId ? { ...m, date: msDate.trim(), title: msTitle.trim(), description: msDesc.trim(), photoUrl: finalPhoto } : m));
            setEditingMsId(null);
          } else {
            setMsList([...msList, {
              id: Date.now().toString(),
              date: msDate.trim(),
              title: msTitle.trim(),
              description: msDesc.trim() || 'Kỷ niệm đáng nhớ',
              icon: 'fa-heart',
              photoUrl: finalPhoto
            }]);
          }
          setMsDate(''); setMsTitle(''); setMsDesc(''); setMsPhoto('');
        };

        const handleSaveNote = () => {
          if (!noteContent.trim()) return;
          const colors = [
            'from-rose-100 to-pink-100 border-rose-200',
            'from-amber-100 to-orange-100 border-amber-200',
            'from-orange-100 to-rose-100 border-orange-200'
          ];
          if (editingNoteId) {
            setNoteList(noteList.map(n => n.id === editingNoteId ? { ...n, author: noteAuthor.trim() || person1 || 'Dấu yêu', content: noteContent.trim(), tag: noteTag.trim() || 'Lời nhắn' } : n));
            setEditingNoteId(null);
          } else {
            setNoteList([{
              id: Date.now().toString(),
              author: noteAuthor.trim() || person1 || 'Dấu yêu',
              content: noteContent.trim(),
              tag: noteTag.trim() || 'Lời nhắn',
              colorBg: colors[Math.floor(Math.random() * colors.length)]
            }, ...noteList]);
          }
          setNoteAuthor(''); setNoteContent(''); setNoteTag('');
        };

        const getCurrentDataBundle = () => {
          return {
            config: {
              ...config,
              person1Name: person1,
              person2Name: person2,
              startDate,
              audioUrl: convertGoogleDriveUrl(audioUrl, 'audio'),
              audioTitle,
              letterContent: letter
            },
            galleryItems: items,
            milestones: msList,
            loveNotes: noteList
          };
        };

        const handleExportJSON = () => {
          const dataBundle = getCurrentDataBundle();
          const blob = new Blob([JSON.stringify(dataBundle, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `love_story_data_${new Date().toISOString().split('T')[0]}.json`;
          a.click();
          URL.revokeObjectURL(url);
        };

        const handleImportJSON = (e) => {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = (event) => {
            try {
              const data = JSON.parse(event.target.result);
              if (data.config) {
                setPerson1(data.config.person1Name || person1);
                setPerson2(data.config.person2Name || person2);
                setStartDate(data.config.startDate || startDate);
                setAudioUrl(data.config.audioUrl || audioUrl);
                setAudioTitle(data.config.audioTitle || audioTitle);
                setLetter(data.config.letterContent || letter);
              }
              if (Array.isArray(data.galleryItems)) setItems(data.galleryItems);
              if (Array.isArray(data.milestones)) setMsList(data.milestones);
              if (Array.isArray(data.loveNotes)) setNoteList(data.loveNotes);
              alert('✨ Đã nhập dữ liệu thành công! Hãy nhấn "Lưu Thay Đổi" để áp dụng lên web.');
            } catch (err) {
              alert('❌ File JSON không hợp lệ. Vui lòng kiểm tra lại!');
            }
          };
          reader.readAsText(file);
        };

        const handleCopyJSON = () => {
          const bundle = getCurrentDataBundle();
          navigator.clipboard.writeText(JSON.stringify(bundle, null, 2));
          setCopySuccess(true);
          setTimeout(() => setCopySuccess(false), 3000);
        };

        return (
          <div className="fixed inset-0 z-[9999] bg-black/70 backdrop-blur-sm flex items-center justify-center p-4 overflow-y-auto">
            <div className="bg-white rounded-3xl max-w-2xl w-full max-h-[92vh] flex flex-col shadow-2xl border border-rose-100 overflow-hidden text-slate-800 my-auto">
              <div className="p-4 sm:p-5 bg-gradient-to-r from-orange-400 via-rose-500 to-pink-500 text-white flex items-center justify-between">
                <h3 className="font-bold text-lg"><i className="fa-solid fa-gear mr-2"></i>Tùy Chỉnh Trang Web</h3>
                <button onClick={onClose} className="p-1 hover:bg-white/20 rounded-full cursor-pointer"><i className="fa-solid fa-xmark text-xl"></i></button>
              </div>

              <div className="flex border-b bg-rose-50/50 text-xs sm:text-sm font-semibold overflow-x-auto no-scrollbar">
                <button
                  onClick={() => setActiveTab('info')}
                  className={`px-3 py-3 flex-1 whitespace-nowrap ${activeTab === 'info' ? 'border-b-2 border-rose-500 text-rose-600 bg-white' : 'text-slate-500'}`}
                >
                  Thông Tin
                </button>
                <button
                  onClick={() => setActiveTab('media')}
                  className={`px-3 py-3 flex-1 whitespace-nowrap ${activeTab === 'media' ? 'border-b-2 border-rose-500 text-rose-600 bg-white' : 'text-slate-500'}`}
                >
                  Ảnh & Video ({items.length})
                </button>
                <button
                  onClick={() => setActiveTab('milestones')}
                  className={`px-3 py-3 flex-1 whitespace-nowrap ${activeTab === 'milestones' ? 'border-b-2 border-rose-500 text-rose-600 bg-white' : 'text-slate-500'}`}
                >
                  Cột Mốc ({msList.length})
                </button>
                <button
                  onClick={() => setActiveTab('notes')}
                  className={`px-3 py-3 flex-1 whitespace-nowrap ${activeTab === 'notes' ? 'border-b-2 border-rose-500 text-rose-600 bg-white' : 'text-slate-500'}`}
                >
                  Lời Nhắn ({noteList.length})
                </button>
                <button
                  onClick={() => setActiveTab('export')}
                  className={`px-3 py-3 flex-1 whitespace-nowrap ${activeTab === 'export' ? 'border-b-2 border-rose-500 text-rose-600 bg-white' : 'text-slate-500'}`}
                >
                  ⚡ Lương/WordPress Sync
                </button>
              </div>

              <div className="p-4 sm:p-5 overflow-y-auto space-y-4 flex-1">
                {activeTab === 'info' && (
                  <>
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-xs font-semibold mb-1">Tên Bạn:</label>
                        <input type="text" value={person1} onChange={e => setPerson1(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                      </div>
                      <div>
                        <label className="block text-xs font-semibold mb-1">Tên Người Yêu:</label>
                        <input type="text" value={person2} onChange={e => setPerson2(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                      </div>
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Ngày Chính Thức Quen Nhau (YYYY-MM-DD):</label>
                      <input type="date" value={startDate} onChange={e => setStartDate(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Link Nhạc MP3 (Tự động hỗ trợ Google Drive & Dropbox link):</label>
                      <input type="url" value={audioUrl} onChange={e => setAudioUrl(e.target.value)} placeholder="https://... hoặc link Google Drive / Dropbox" className="w-full px-3 py-2 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Tên Bài Hát Hiển Thị:</label>
                      <input type="text" value={audioTitle} onChange={e => setAudioTitle(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold mb-1">Bức Thư Tình:</label>
                      <textarea rows={4} value={letter} onChange={e => setLetter(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-sm" />
                    </div>
                  </>
                )}

                {activeTab === 'media' && (
                  <>
                    <div className="bg-rose-50 p-4 rounded-2xl border border-rose-100 space-y-2.5">
                      <div className="flex items-center justify-between">
                        <h4 className="font-semibold text-xs sm:text-sm text-slate-800">
                          {editingItemId ? 'Chỉnh Sửa Ảnh / Video:' : 'Thêm Ảnh / Video Mới:'}
                        </h4>
                        {editingItemId ? (
                          <button onClick={resetGalleryForm} className="text-xs text-rose-600 underline font-medium cursor-pointer">Hủy sửa</button>
                        ) : (
                          <span className="text-[11px] text-rose-600 font-medium bg-rose-100/80 px-2 py-0.5 rounded-full">✨ Tự động nhận diện Google Drive & Dropbox</span>
                        )}
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" placeholder="Tiêu đề (*)..." value={newItemTitle} onChange={e => setNewItemTitle(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none focus:border-rose-400" />
                        <select value={newItemType} onChange={e => setNewItemType(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none focus:border-rose-400">
                          <option value="image">Hình ảnh (Image)</option>
                          <option value="video">Video Clip (MP4)</option>
                        </select>
                      </div>
                      <input type="url" placeholder="Dán URL direct hoặc link Google Drive / Dropbox ảnh/video (*)..." value={newItemUrl} onChange={e => setNewItemUrl(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none focus:border-rose-400" />
                      {newItemType === 'video' && (
                        <input type="url" placeholder="Link ảnh bìa/xem trước Clip (Poster / Drive / Dropbox link)..." value={newItemPoster} onChange={e => setNewItemPoster(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none focus:border-rose-400" />
                      )}
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" placeholder="Thời gian / Mốc kỷ niệm (VD: Tháng 2 - Tuần 3)..." value={newItemDate} onChange={e => setNewItemDate(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none focus:border-rose-400" />
                        <input type="text" placeholder="Nội dung / Lời nhắn mô tả kỷ niệm..." value={newItemCaption} onChange={e => setNewItemCaption(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none focus:border-rose-400" />
                      </div>
                      <div className="flex items-center gap-2 pt-0.5">
                        <button
                          type="button"
                          onClick={() => setNewItemCategory(newItemCategory === 'highlight' ? 'daily' : 'highlight')}
                          className={`px-3 py-1.5 rounded-xl border text-xs font-semibold flex items-center gap-1.5 transition-all cursor-pointer ${
                            newItemCategory === 'highlight'
                              ? 'bg-rose-500 text-white border-rose-500 shadow-sm'
                              : 'bg-white text-slate-600 border-slate-200 hover:border-rose-300'
                          }`}
                        >
                          <i className={`fa-solid fa-heart ${newItemCategory === 'highlight' ? 'text-white' : 'text-rose-500'}`}></i>
                          <span>{newItemCategory === 'highlight' ? 'Đã chọn: Mục Đặc Sắc ❤️' : 'Chuyển qua mục Đặc Sắc (Bấm chọn)'}</span>
                        </button>
                      </div>
                      <button onClick={handleSaveItem} className="w-full py-2.5 bg-rose-500 hover:bg-rose-600 text-white font-medium text-xs rounded-xl transition-colors cursor-pointer">
                        {editingItemId ? 'Cập Nhật Ảnh / Video' : 'Thêm Vào Danh Sách'}
                      </button>
                    </div>

                    <div className="space-y-2 max-h-[250px] overflow-y-auto">
                      {items.map((it) => (
                        <div key={it.id} className={`flex items-center justify-between p-2.5 rounded-xl border text-xs ${editingItemId === it.id ? 'bg-rose-50 border-rose-300 ring-2 ring-rose-300' : 'bg-slate-50'}`}>
                          <div className="flex items-center gap-2.5 truncate min-w-0 flex-1">
                            <span className="font-bold">{it.type === 'image' ? '🖼️' : '🎬'}</span>
                            <span className="truncate font-semibold text-slate-800">{it.title}</span>
                            {it.category === 'highlight' && (
                              <span className="text-[10px] bg-rose-100 text-rose-600 font-bold px-1.5 py-0.5 rounded-full flex-shrink-0">Đặc sắc</span>
                            )}
                          </div>
                          <div className="flex items-center gap-1.5 flex-shrink-0">
                            <button
                              type="button"
                              onClick={() => handleStartEditItem(it)}
                              title="Chỉnh sửa chi tiết & link của mục này"
                              className="p-1.5 rounded-lg border border-slate-200 text-slate-600 hover:text-rose-600 hover:bg-rose-100 hover:border-rose-300 cursor-pointer transition-colors"
                            >
                              <i className="fa-solid fa-pen"></i>
                            </button>
                            <button
                              type="button"
                              onClick={() => {
                                setItems(
                                  items.map((i) =>
                                    i.id === it.id
                                      ? { ...i, category: i.category === 'highlight' ? 'daily' : 'highlight' }
                                      : i
                                  )
                                );
                              }}
                              title={it.category === 'highlight' ? 'Đang ở mục Đặc Sắc (Bấm để đổi)' : 'Chuyển sang mục Đặc Sắc'}
                              className={`p-1.5 rounded-lg border text-xs font-semibold flex items-center gap-1 transition-all cursor-pointer ${
                                it.category === 'highlight'
                                  ? 'bg-rose-500 text-white border-rose-500 shadow-sm'
                                  : 'bg-white text-slate-500 border-slate-200 hover:text-rose-500 hover:border-rose-300'
                              }`}
                            >
                              <i className={`fa-solid fa-heart ${it.category === 'highlight' ? 'text-white' : ''}`}></i>
                              <span className="hidden sm:inline">{it.category === 'highlight' ? 'Đặc sắc' : 'Thường'}</span>
                            </button>
                            <button onClick={() => {
                              if (editingItemId === it.id) resetGalleryForm();
                              setItems(items.filter(i => i.id !== it.id));
                            }} className="text-rose-500 hover:text-rose-700 p-1.5 hover:bg-rose-100 rounded-lg cursor-pointer">
                              <i className="fa-solid fa-trash"></i>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {activeTab === 'milestones' && (
                  <>
                    <div className="bg-orange-50 p-4 rounded-2xl border border-orange-100 space-y-2.5">
                      <div className="flex justify-between items-center">
                        <h4 className="font-semibold text-xs sm:text-sm text-slate-800">
                          {editingMsId ? 'Chỉnh Sửa Cột Mốc Tình Yêu' : 'Thêm Cột Mốc Mới:'}
                        </h4>
                        {editingMsId && (
                          <button onClick={() => { setEditingMsId(null); setMsDate(''); setMsTitle(''); setMsDesc(''); setMsPhoto(''); }} className="text-xs text-slate-500 underline">Hủy sửa</button>
                        )}
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" placeholder="Mốc thời gian (VD: Ngày 1)... (*)" value={msDate} onChange={e => setMsDate(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                        <input type="text" placeholder="Tiêu đề cột mốc... (*)" value={msTitle} onChange={e => setMsTitle(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                      </div>
                      <textarea rows={2} placeholder="Mô tả kỷ niệm..." value={msDesc} onChange={e => setMsDesc(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                      <input type="url" placeholder="Link ảnh minh họa (không bắt buộc)..." value={msPhoto} onChange={e => setMsPhoto(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                      <button onClick={handleSaveMilestone} className="w-full py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-medium text-xs rounded-xl transition-colors cursor-pointer">
                        {editingMsId ? 'Cập Nhật Cột Mốc' : 'Thêm Cột Mốc'}
                      </button>
                    </div>

                    <div className="space-y-2 max-h-[250px] overflow-y-auto">
                      {msList.map((m) => (
                        <div key={m.id} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border text-xs gap-2">
                          <div className="min-w-0 flex-1">
                            <span className="font-bold text-rose-600 mr-2">{m.date}</span>
                            <span className="font-semibold">{m.title}</span>
                            <p className="text-slate-500 text-[11px] truncate">{m.description}</p>
                          </div>
                          <div className="flex gap-1">
                            <button onClick={() => { setEditingMsId(m.id); setMsDate(m.date); setMsTitle(m.title); setMsDesc(m.description); setMsPhoto(m.photoUrl || ''); }} className="p-1 text-slate-600 hover:text-slate-900 cursor-pointer"><i className="fa-solid fa-pen"></i></button>
                            <button onClick={() => setMsList(msList.filter(x => x.id !== m.id))} className="p-1 text-rose-500 hover:text-rose-700 cursor-pointer"><i className="fa-solid fa-trash"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {activeTab === 'notes' && (
                  <>
                    <div className="bg-pink-50 p-4 rounded-2xl border border-pink-100 space-y-2.5">
                      <div className="flex justify-between items-center">
                        <h4 className="font-semibold text-xs sm:text-sm text-slate-800">
                          {editingNoteId ? 'Chỉnh Sửa Lời Nhắn' : 'Thêm Lời Nhắn Mới:'}
                        </h4>
                        {editingNoteId && (
                          <button onClick={() => { setEditingNoteId(null); setNoteAuthor(''); setNoteContent(''); setNoteTag(''); }} className="text-xs text-slate-500 underline">Hủy sửa</button>
                        )}
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                        <input type="text" placeholder="Người gửi (VD: Anh yêu)..." value={noteAuthor} onChange={e => setNoteAuthor(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                        <input type="text" placeholder="Chủ đề / Nhãn..." value={noteTag} onChange={e => setNoteTag(e.target.value)} className="px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                      </div>
                      <textarea rows={2} placeholder="Nội dung lời nhắn... (*)" value={noteContent} onChange={e => setNoteContent(e.target.value)} className="w-full px-3 py-2 border rounded-xl text-xs bg-white focus:outline-none" />
                      <button onClick={handleSaveNote} className="w-full py-2.5 bg-pink-500 hover:bg-pink-600 text-white font-medium text-xs rounded-xl transition-colors cursor-pointer">
                        {editingNoteId ? 'Cập Nhật Lời Nhắn' : 'Thêm Lời Nhắn'}
                      </button>
                    </div>

                    <div className="space-y-2 max-h-[250px] overflow-y-auto">
                      {noteList.map((n) => (
                        <div key={n.id} className="flex items-center justify-between p-2.5 bg-slate-50 rounded-xl border text-xs gap-2">
                          <div className="min-w-0 flex-1">
                            <span className="font-bold text-pink-600 mr-2">[{n.tag || 'Lời nhắn'}]</span>
                            <span className="text-slate-500">Từ {n.author}:</span>
                            <p className="italic text-slate-800 truncate">"{n.content}"</p>
                          </div>
                          <div className="flex gap-1">
                            <button onClick={() => { setEditingNoteId(n.id); setNoteAuthor(n.author); setNoteContent(n.content); setNoteTag(n.tag); }} className="p-1 text-slate-600 hover:text-slate-900 cursor-pointer"><i className="fa-solid fa-pen"></i></button>
                            <button onClick={() => setNoteList(noteList.filter(x => x.id !== n.id))} className="p-1 text-rose-500 hover:text-rose-700 cursor-pointer"><i className="fa-solid fa-trash"></i></button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </>
                )}

                {activeTab === 'export' && (
                  <>
                    <div className="bg-slate-50 p-4 rounded-2xl border space-y-3">
                      <h4 className="font-bold text-sm text-slate-800 flex items-center gap-1.5">
                        <i className="fa-solid fa-file-export text-rose-500"></i>
                        <span>Sao Lưu & Đồng Bộ Dữ Liệu Qua Thiết Bị Khác</span>
                      </h4>
                      <p className="text-xs text-slate-600 leading-relaxed">
                        Mặc định web tự lưu vào bộ nhớ trình duyệt máy này. Nếu bạn muốn chuyển dữ liệu đã chỉnh sang thiết bị/trình duyệt khác hoặc lưu lâu dài trên WordPress, chọn một trong các cách sau:
                      </p>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">
                        <button
                          onClick={handleExportJSON}
                          className="px-4 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold flex items-center justify-center gap-2 transition-colors cursor-pointer"
                        >
                          <i className="fa-solid fa-download"></i>
                          <span>Xuất File Cấu Hình JSON</span>
                        </button>

                        <label className="px-4 py-2.5 rounded-xl bg-rose-500 hover:bg-rose-600 text-white text-xs font-semibold flex items-center justify-center gap-2 transition-colors cursor-pointer">
                          <i className="fa-solid fa-upload"></i>
                          <span>Nhập File JSON Tải Về</span>
                          <input type="file" accept=".json" onChange={handleImportJSON} className="hidden" />
                        </label>
                      </div>

                      <button
                        onClick={handleCopyJSON}
                        className="w-full py-2.5 rounded-xl bg-rose-100 hover:bg-rose-200 text-rose-700 text-xs font-semibold flex items-center justify-center gap-2 transition-colors cursor-pointer"
                      >
                        <i className="fa-solid fa-copy"></i>
                        <span>{copySuccess ? '✨ Đã Copy Mã JSON Vào Bộ Nhớ Tạm!' : 'Copy Mã JSON Dữ Liệu Hiện Tại'}</span>
                      </button>
                    </div>

                    <div className="bg-amber-50 p-4 rounded-2xl border border-amber-200 text-xs text-slate-700 space-y-2">
                      <h5 className="font-bold text-amber-800 flex items-center gap-1">
                        <i className="fa-brands fa-wordpress text-amber-600"></i>
                        <span>Cách nạp file HTML hoàn chỉnh lên WordPress:</span>
                      </h5>
                      <ol className="list-decimal pl-4 space-y-1">
                        <li>Mở trình quản trị WordPress &gt; Tạo Bài viết / Trang mới (hoặc Elementor).</li>
                        <li>Thêm khối block <strong>Custom HTML</strong> (HTML Tùy chỉnh).</li>
                        <li>Dán toàn bộ mã HTML này vào khối Custom HTML và bấm <strong>Xuất bản (Publish)</strong>.</li>
                        <li><strong>Mẹo thấy dữ liệu cố định trên mọi thiết bị:</strong> Trước khi nhúng HTML lên WordPress, bạn chỉ cần thay nội dung JSON vừa Copy ở nút trên vào biến <code className="bg-white/80 px-1 rounded border">defaultCoupleConfig</code>, <code className="bg-white/80 px-1 rounded border">defaultGalleryItems</code>, v.v. trong file HTML. Khi đó bất kỳ ai truy cập trên điện thoại/máy tính khác đều thấy đầy đủ!</li>
                      </ol>
                    </div>
                  </>
                )}
              </div>

              <div className="p-4 bg-slate-50 border-t flex items-center justify-between">
                <button onClick={onClose} className="text-xs text-slate-600 font-medium cursor-pointer">Hủy</button>
                <button onClick={handleSave} className="px-5 py-2 rounded-full bg-gradient-to-r from-orange-400 to-rose-500 text-white text-xs font-bold shadow-md cursor-pointer">Lưu Thay Đổi</button>
              </div>
            </div>
          </div>
        );
      };

      // 9. Footer
      const Footer = ({ person1Name, person2Name, onOpenCustomizer }) => {
        return (
          <footer className="mt-16 pt-10 pb-20 border-t border-rose-200/60 bg-gradient-to-b from-transparent to-rose-100/40 text-center z-10 relative">
            <h3 className="font-dancing text-3xl font-bold text-slate-800">
              {person1Name} ❤️ {person2Name}
            </h3>
            <p className="mt-1 text-sm text-slate-600 font-medium">
              Mãi bên nhau bình yên & hạnh phúc - Kỷ niệm 2 tháng yêu nhau
            </p>
            <div className="mt-4">
              <button
                onClick={onOpenCustomizer}
                className="inline-flex items-center gap-1.5 px-4 py-2 rounded-full bg-white/80 hover:bg-white text-rose-600 font-semibold text-xs shadow-sm border border-rose-200 cursor-pointer"
              >
                <i className="fa-solid fa-pen-to-square"></i>
                <span>Tùy chỉnh nội dung, mốc kỷ niệm & lời nhắn</span>
              </button>
            </div>
          </footer>
        );
      };

      // --- MAIN ROOT APP ---
      const App = () => {
        const [config, setConfig] = useState(() => {
          const saved = localStorage.getItem('love_story_config');
          return saved ? JSON.parse(saved) : defaultCoupleConfig;
        });

        const [galleryItems, setGalleryItems] = useState(() => {
          const saved = localStorage.getItem('love_story_gallery');
          return saved ? JSON.parse(saved) : defaultGalleryItems;
        });

        const [milestones, setMilestones] = useState(() => {
          const saved = localStorage.getItem('love_story_milestones');
          return saved ? JSON.parse(saved) : defaultMilestones;
        });

        const [loveNotes, setLoveNotes] = useState(() => {
          const saved = localStorage.getItem('love_story_notes');
          return saved ? JSON.parse(saved) : defaultLoveNotes;
        });

        const [isPlayingMusic, setIsPlayingMusic] = useState(false);
        const [isCustomizerOpen, setIsCustomizerOpen] = useState(false);

        useEffect(() => {
          localStorage.setItem('love_story_config', JSON.stringify(config));
        }, [config]);

        useEffect(() => {
          localStorage.setItem('love_story_gallery', JSON.stringify(galleryItems));
        }, [galleryItems]);

        useEffect(() => {
          localStorage.setItem('love_story_milestones', JSON.stringify(milestones));
        }, [milestones]);

        useEffect(() => {
          localStorage.setItem('love_story_notes', JSON.stringify(loveNotes));
        }, [loveNotes]);

        const handleAnniversaryClick = () => {
          setIsPlayingMusic(true);
          const galleryEl = document.getElementById('gallery-section');
          if (galleryEl) {
            galleryEl.scrollIntoView({ behavior: 'smooth' });
          }
        };

        return (
          <div className="relative min-h-screen overflow-x-hidden font-sans text-slate-800 animate-fade-in">
            <FloatingHearts />

            <HeaderHero
              person1Name={config.person1Name}
              person2Name={config.person2Name}
              heroSubtitle={config.heroSubtitle}
              isPlayingMusic={isPlayingMusic}
              onAnniversaryClick={handleAnniversaryClick}
            />

            <LoveCounter
              startDateStr={config.startDate}
              person1Name={config.person1Name}
              person2Name={config.person2Name}
            />

            <GallerySection items={galleryItems} onUpdateItems={setGalleryItems} />

            <TimelineSection milestones={milestones} />

            <LoveNotesSection
              letterContent={config.letterContent}
              notes={loveNotes}
              onUpdateNotes={setLoveNotes}
              person1Name={config.person1Name}
              person2Name={config.person2Name}
            />

            <Footer
              person1Name={config.person1Name}
              person2Name={config.person2Name}
              onOpenCustomizer={() => setIsCustomizerOpen(true)}
            />

            <AudioPlayerWidget
              audioUrl={config.audioUrl}
              audioTitle={config.audioTitle}
              isPlaying={isPlayingMusic}
              onTogglePlay={() => setIsPlayingMusic(!isPlayingMusic)}
            />

            <CustomizerModal
              isOpen={isCustomizerOpen}
              onClose={() => setIsCustomizerOpen(false)}
              config={config}
              onSaveConfig={setConfig}
              galleryItems={galleryItems}
              onSaveGallery={setGalleryItems}
              milestones={milestones}
              onSaveMilestones={setMilestones}
              loveNotes={loveNotes}
              onSaveLoveNotes={setLoveNotes}
            />
          </div>
        );
      };

      // Mount App to DOM
      const root = ReactDOM.createRoot(document.getElementById('root'));
      root.render(<App />);
    </script>
  </body>
</html>
